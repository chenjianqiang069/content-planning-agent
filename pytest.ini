[pytest]
# Allow tests to import src and tests.conftest
pythonpath = .
testpaths = tests
python_files = test_*.py
# Default run excludes network tests so a plain `pytest` is fast and offline.
# Run the real-model suite explicitly with: pytest -m network
addopts = -q --strict-markers -m "not network"
markers =
    network: requires a real Anthropic API key (skipped by default; enable with -m network)
    slow: slower tests (real model calls)
